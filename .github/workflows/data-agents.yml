name: Weekly data agents

# Runs every Monday at 06:00 UTC, or manually from the Actions tab.
# Never runs on pull requests, so the API key is never exposed to forks or outside contributors.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-agents
  cancel-in-progress: false

jobs:
  update:
    # Kill switch: the weekly schedule only runs when the repository variable AGENTS_ENABLED is 'true'.
    if: github.event_name == 'workflow_dispatch' || vars.AGENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AGENT_MODEL: ${{ vars.AGENT_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          pip install anthropic requests beautifulsoup4 jsonschema playwright
          python -m playwright install --with-deps chromium

      - name: Research agent (proposes candidates only)
        working-directory: agents
        run: python research_agent.py

      - name: QA agent (confirms candidates, audits a rotating batch)
        working-directory: agents
        run: python qa_agent.py

      - name: Gate 1 - schema and data rules
        run: python tools/validate.py

      - name: Gate 2 - nothing deleted, additions within limits
        run: python tools/change_guard.py

      - name: Build the offline snapshot into index.html
        run: python tools/build.py

      - name: Gate 3 - the app loads and renders the new data
        run: python tools/smoke_test.py

      - name: Publish (only reached if every gate passed)
        run: |
          git config user.name  "shrinking-gap-data-agent"
          git config user.email "data-agent@users.noreply.github.com"
          git add data/data.json data/pending.json index.html
          if git diff --cached --quiet; then echo "No changes to publish."; exit 0; fi
          REV=$(python -c "import json;print(json.load(open('data/data.json'))['meta']['revision'])")
          SUMMARY=$(python -c "import json;print(json.load(open('data/data.json'))['meta']['changelog'][-1]['summary'])")
          git commit -m "Data revision ${REV}: ${SUMMARY}"
          git tag -a "data-r${REV}" -m "Data revision ${REV}: ${SUMMARY}"
          git push origin main
          git push origin "data-r${REV}"
