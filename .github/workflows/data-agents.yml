name: Weekly data agents

# Runs every Monday at 06:00 UTC, or manually from the Actions tab.
# Never runs on pull requests, so the API key is never exposed to forks or outside contributors.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      deep:
        description: 'Run the deeper audit (stronger model, bigger batch)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: data-agents
  cancel-in-progress: false

jobs:
  update:
    # Kill switch: the weekly schedule only runs when the repository variable AGENTS_ENABLED is 'true'.
    if: github.event_name == 'workflow_dispatch' || vars.AGENTS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AGENT_MODEL: ${{ vars.AGENT_MODEL }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Remember the data revision this run starts from
        run: |
          echo "START_REV=$(python3 -c "import json;print(json.load(open('data/data.json'))['meta']['revision'])")" >> "$GITHUB_ENV"
          echo "START_HASH=$(sha256sum data/data.json | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Install tools
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Monthly deeper audit (first Monday of each month, or on request)
        run: |
          if [ "$(date -u +%d)" -le 7 ] || [ "${{ github.event.inputs.deep }}" = "true" ]; then echo "QA_DEEP=1" >> "$GITHUB_ENV"; echo "Deep audit this run."; fi

      - name: Research agent (proposes candidates only)
        working-directory: agents
        run: python research_agent.py

      - name: Gemini research (a second model finds up to 10; Claude's QA confirms them)
        continue-on-error: true
        working-directory: agents
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python gemini_research.py

      - name: QA agent (confirms candidates, audits a rotating batch)
        working-directory: agents
        run: python qa_agent.py

      - name: Gemini second opinion (checks Claude's additions; anything not supported is marked disputed)
        continue-on-error: true
        working-directory: agents
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python gemini_check.py

      - name: Guidance agent (new and updated security guidance, CAF and Ofgem first)
        working-directory: agents
        run: python guidance_agent.py

      - name: Tour agent (refreshes the walk-through scripts within fixed rules)
        continue-on-error: true
        working-directory: agents
        run: python tour_agent.py

      - name: AI levers agent (researches how AI could speed each projected technology)
        continue-on-error: true
        working-directory: agents
        run: python levers_agent.py

      - name: Story agent (researches research, first use and impact, most recent first)
        continue-on-error: true
        working-directory: agents
        run: python story_agent.py

      - name: Gate 1 - schema and data rules
        run: python tools/validate.py

      - name: Gate 2 - nothing deleted, additions within limits
        run: python tools/change_guard.py

      - name: Build the offline snapshot into index.html
        run: python tools/build.py

      - name: Gate 3 - the app loads and renders the new data
        run: python tools/smoke_test.py

      - name: Voice (records changed narration; skipped without a key, never blocks publishing)
        continue-on-error: true
        env:
          TTS_API_KEY: ${{ secrets.TTS_API_KEY }}
          TTS_REGION: ${{ vars.TTS_REGION }}
        run: python tools/make_voice.py

      - name: Publish (only reached if every gate passed)
        id: publish
        run: |
          git config user.name  "shrinking-gap-data-agent"
          git config user.email "data-agent@users.noreply.github.com"
          git add data/data.json data/pending.json data/pending_founders.json data/tours.json index.html
          if [ -d audio ]; then git add -A audio; fi
          if git diff --cached --quiet; then echo "No changes to publish."; exit 0; fi
          REV=$(python -c "import json;print(json.load(open('data/data.json'))['meta']['revision'])")
          SUMMARY=$(python tools/run_summary.py)   # what this whole run changed, compared with the last published data
          git commit -m "Data revision ${REV}: ${SUMMARY}"
          # This run takes a while. If the repository moved on meanwhile (an upload, or a rebuild of the app), lay this run's
          # data files on top of the latest WHOLE (data files are never merged line by line), and rebuild the page from the
          # latest code. If another agent run published data meanwhile, stop rather than overwrite it; the results are kept.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" = 3 ]; then echo "Could not publish after three attempts."; exit 1; fi
            git fetch origin main
            MAIN_HASH=$(git show origin/main:data/data.json | sha256sum | cut -d' ' -f1)
            if [ "$MAIN_HASH" != "$START_HASH" ]; then echo "The data on main changed since this run started (another run or an edit), so this run will not overwrite it. Its results are kept as an artifact; run the workflow again to redo them on the latest data."; exit 1; fi
            echo "The repository moved on during this run, but the data did not; putting this run's data on top of the latest and retrying ($attempt)."
            KEEP=$(mktemp -d); cp -r data "$KEEP/"; if [ -d audio ]; then cp -r audio "$KEEP/"; fi
            git reset --hard origin/main
            cp "$KEEP/data/data.json" "$KEEP/data/pending.json" "$KEEP/data/pending_founders.json" "$KEEP/data/tours.json" data/
            if [ -d "$KEEP/audio" ]; then rm -rf audio && cp -r "$KEEP/audio" audio; fi
            python tools/build.py
            git add data/data.json data/pending.json data/pending_founders.json data/tours.json index.html
            if [ -d audio ]; then git add -A audio; fi
            git commit -m "Data revision ${REV}: ${SUMMARY}"
            sleep 5
          done
          git tag -a "data-r${REV}" -m "Data revision ${REV}: ${SUMMARY}"
          git push origin "data-r${REV}"
          echo "published=1" >> "$GITHUB_OUTPUT"
          echo "rev=${REV}" >> "$GITHUB_OUTPUT"

      - name: Keep this run's results if publishing failed (download them from the run's Artifacts)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unpublished-results-run-${{ github.run_number }}
          path: |
            data/
            index.html
            audio/
          if-no-files-found: ignore
          retention-days: 14

      - name: Weekly digest (a GitHub issue, which also emails you)
        if: steps.publish.outputs.published == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/digest.py > digest.md
          gh label create data-update --color 5FD8FF --description "Weekly data agent digest" --force || true
          gh issue create --title "Data revision ${{ steps.publish.outputs.rev }}: $(head -1 digest.md | tr -d '*')" --body-file digest.md --label data-update

      - name: Monthly DESNZ vision digest (with the deep audit)
        if: steps.publish.outputs.published == '1' && env.QA_DEEP == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/digest.py --desnz > desnz.md
          gh label create desnz --color F2D38A --description "Monthly DESNZ vision digest" --force || true
          gh issue create --title "DESNZ vision monthly: $(date -u +%B\ %Y)" --body-file desnz.md --label desnz
