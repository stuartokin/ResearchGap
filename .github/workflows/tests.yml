name: Test suite

# Never runs on its own: run it by hand before or after a significant change. It does not publish anything.
on:
  workflow_dispatch:
    inputs:
      suites:
        description: 'Which tests'
        type: choice
        options: [all, agents, browser]
        default: all

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run the tests (the portable rig builds first, borrows experimental/ for the AI suites, and reruns failures alone)
        run: python tests/rig.py ${{ github.event.inputs.suites || 'all' }}
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            tests/_last_run.txt
            tests/_last_run.log
