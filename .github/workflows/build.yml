name: Build the app

# Rebuilds index.html whenever the app's source files change, so you only ever upload the small file you edited.
# It assembles src/ into index.html, embeds the current data, checks it, and publishes only if every check passes.
on:
  push:
    branches: [main]
    paths: ['src/**', 'tools/build.py', 'tools/build_ai.py', 'data/tours.json']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-agents          # shared with the weekly agents, so the two never commit at the same time
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main            # always build the latest files, not the upload that triggered this run
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Assemble index.html from src/
        run: python tools/build.py
      - name: Build the AI-enhanced version (standard app plus experimental features; never blocks publishing)
        run: bash tools/build_ai.sh
      - name: Check the data and scripts
        run: python tools/validate.py
      - name: Smoke test the built page
        run: python tools/smoke_test.py
      - name: Publisher credential (short-lived, so created just before publishing)
        id: publisher
        continue-on-error: true   # if it cannot be created, publishing falls back to the workflow's own token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PUBLISH_APP_ID }}
          private-key: ${{ secrets.PUBLISH_APP_PRIVATE_KEY }}
      - name: Publish the new index.html
        env:
          PUBLISH_TOKEN: ${{ steps.publisher.outputs.token }}
        run: |
          # publish as research-gap-publisher, which may update main under the ruleset
          if [ -n "$PUBLISH_TOKEN" ]; then
            git config --unset-all http.https://github.com/.extraheader || true
            git remote set-url origin "https://x-access-token:${PUBLISH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            echo "Publishing as research-gap-publisher."
          else
            echo "::warning::Publisher credential unavailable; publishing with the workflow's own token."
          fi
          git config user.name "app-build"
          git config user.email "app-build@users.noreply.github.com"
          # Uploading several files makes several commits; if the repository moves on while this run works,
          # fetch the latest, rebuild and try again, rather than failing.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python tools/build.py
            bash tools/build_ai.sh
            python tools/validate.py
            git add index.html ai
            if git diff --cached --quiet; then echo "index.html and the AI-enhanced version are up to date."; exit 0; fi
            git commit -m "Build index.html from src"
            if git push origin HEAD:main; then echo "Published."; exit 0; fi
            echo "The repository moved on; retrying ($attempt)."; sleep 10
          done
          exit 1
